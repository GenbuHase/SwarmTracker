<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SwarmTracker iframe embed preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Source Serif 4", Georgia, serif;
      color: #1a1a1a;
      background: #faf8f5;
    }
    .site-header {
      border-bottom: 1px solid #e5e0d8;
      padding: 20px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #fff;
    }
    .logo { font-weight: 600; letter-spacing: -0.02em; font-size: 1.1rem; }
    .site-header nav {
      font-family: "IBM Plex Sans JP", system-ui, sans-serif;
      font-size: 0.85rem;
      color: #666;
      display: flex;
      gap: 18px;
    }
    .article {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 24px 80px;
    }
    h1 {
      font-size: clamp(1.75rem, 4vw, 2.35rem);
      line-height: 1.25;
      letter-spacing: -0.02em;
      margin: 0 0 12px;
      font-weight: 600;
    }
    .byline {
      font-family: "IBM Plex Sans JP", system-ui, sans-serif;
      font-size: 0.85rem;
      color: #777;
      margin-bottom: 28px;
    }
    p {
      font-size: 1.05rem;
      line-height: 1.75;
      margin: 0 0 1.25em;
    }
    .embed-slot {
      margin: 28px 0 36px;
      padding: 18px 0;
      border-top: 1px dashed #d5cfc6;
      border-bottom: 1px dashed #d5cfc6;
    }
    .embed-caption {
      font-family: "IBM Plex Sans JP", system-ui, sans-serif;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 12px;
    }
    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.85em;
      background: #f0ebe3;
      padding: 0.1em 0.35em;
      border-radius: 4px;
    }
    iframe {
      display: block;
      background: transparent;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo">example.blog</div>
    <nav><span>記事</span><span>About</span></nav>
  </header>

  <article class="article">
    <h1>週末の短いメモ</h1>
    <p class="byline">2026.07.12 · 実際の iframe 埋め込みプレビュー</p>
    <p>
      下記は <code>/embed</code> を iframe で読み込んだ実物です。
      省略時の既定は <strong>stack</strong>、<code>?variant=compact</code> で一行表示に切り替えます。
      背景は透明、ホスト側は <code>postMessage</code> で実寸にリサイズします。
    </p>

    <div class="embed-slot">
      <div class="embed-caption">/embed（既定 = stack） · auto-sized</div>
      <iframe
        id="embed-stack"
        src="/embed"
        title="SwarmTracker stack"
        width="280"
        height="160"
        style="border:0;width:280px;height:160px"
        loading="eager"
      ></iframe>
    </div>

    <p>
      ホスト側の記事背景が透け、ウィジェットのパネルだけが見えます。
    </p>

    <div class="embed-slot">
      <div class="embed-caption">/embed?variant=compact · auto-sized</div>
      <iframe
        id="embed-compact"
        src="/embed?variant=compact"
        title="SwarmTracker compact"
        width="340"
        height="56"
        style="border:0;width:340px;height:56px"
        loading="eager"
      ></iframe>
    </div>
  </article>

  <script>
    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || data.source !== "swarmtracker:resize") return;
      const frame =
        data.variant === "compact"
          ? document.getElementById("embed-compact")
          : document.getElementById("embed-stack");
      if (!(frame instanceof HTMLIFrameElement)) return;
      frame.style.width = data.width + "px";
      frame.style.height = data.height + "px";
      frame.width = String(data.width);
      frame.height = String(data.height);
      const caption = frame.parentElement?.querySelector(".embed-caption");
      if (caption) {
        caption.textContent =
          (data.variant === "compact"
            ? "/embed?variant=compact"
            : "/embed（既定 = stack）") +
          " · " + data.width + "×" + data.height;
      }
    });
  </script>
</body>
</html>
